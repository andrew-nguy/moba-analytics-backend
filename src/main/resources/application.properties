spring.application.name=moba-analytics
riot.api.key=${RIOT_API_KEY}
spring.data.redis.url=${REDIS_URL}
spring.cache.type=redis
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
cors.allowed.origins=${CORS_ORIGINS}
spring.ai.google.genai.api-key=${GOOGLE_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.default-schema=moba_auth
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
